spring:
  application:
    name: cognito-rbac

server:
  port: 8080

# ---------------------------------------------------------------------------
# AWS Cognito integration
# ---------------------------------------------------------------------------
# AWS credentials are resolved via the default AWS SDK provider chain
# (env vars, ~/.aws/credentials, or an assumed IAM role / IRSA in EKS).
# Never hard-code access keys here. The service principal needs the following
# Cognito IAM actions on the target User Pool:
#   cognito-idp:ListUsers, AdminGetUser, AdminListGroupsForUser,
#   ListGroups, GetGroup, CreateGroup, UpdateGroup,
#   AdminAddUserToGroup, AdminRemoveUserFromGroup, ListUsersInGroup
cognito:
  region: ${COGNITO_REGION:us-east-1}
  user-pool-id: ${COGNITO_USER_POOL_ID:}
  app-client-id: ${COGNITO_APP_CLIENT_ID:}
  # Azure-managed Cognito group that is the source of truth for the app's users.
  # The /api/v1/users endpoint lists only the members of this group.
  source-group: ${COGNITO_SOURCE_GROUP:}
  admin-group: ${COGNITO_ADMIN_GROUP:rbac-admins}
  default-page-size: 25

# ---------------------------------------------------------------------------
# AWS Verified Permissions (AVP)
# ---------------------------------------------------------------------------
verified-permissions:
  region: ${AVP_REGION:${COGNITO_REGION:us-east-1}}
  policy-store-id: ${AVP_POLICY_STORE_ID:}
  # The Cognito User Pool ARN used to create the identity source in AVP.
  user-pool-arn: ${COGNITO_USER_POOL_ARN:}
  # Namespace used in the Cedar schema. All entity types are prefixed with this.
  namespace: ${AVP_NAMESPACE:Portal}
  # Super admin group — only this group can create module admins.
  super-admin-group: ${AVP_SUPER_ADMIN_GROUP:global:global:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.designpattern.cognitorbac: INFO
    software.amazon.awssdk: WARN
