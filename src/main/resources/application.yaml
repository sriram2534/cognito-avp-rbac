spring:
  application:
    name: cognito-rbac
  profiles:
    # Local is the safe default for developer workstations and tests. Deployments
    # must activate a non-local profile (for example, dev/staging/production),
    # which switches Logback to newline-delimited JSON for CloudWatch ingestion.
    default: local
  data:
    mongodb:
      auto-index-creation: true

server:
  port: 8080

deployment:
  environment: ${DEPLOYMENT_ENVIRONMENT:local}

# ---------------------------------------------------------------------------
# AWS Cognito integration
# ---------------------------------------------------------------------------
# AWS credentials are resolved via the default AWS SDK provider chain
# (env vars, ~/.aws/credentials, or an assumed IAM role / IRSA in EKS).
# Never hard-code access keys here. The service principal needs the following
# Cognito IAM actions on the target User Pool:
#   cognito-idp:ListUsers, AdminGetUser
cognito:
  region: ${COGNITO_REGION:us-east-1}
  user-pool-id: ${COGNITO_USER_POOL_ID:}
  app-client-id: ${COGNITO_APP_CLIENT_ID:}
  default-page-size: 25

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.designpattern.cognitorbac: ${APPLICATION_LOG_LEVEL:INFO}
    software.amazon.awssdk: WARN
