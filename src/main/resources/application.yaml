spring:
  application:
    name: cognito-rbac
  data:
    mongodb:
      auto-index-creation: true

server:
  port: 8080

# ---------------------------------------------------------------------------
# AWS Cognito integration
# ---------------------------------------------------------------------------
# AWS credentials are resolved via the default AWS SDK provider chain
# (env vars, ~/.aws/credentials, or an assumed IAM role / IRSA in EKS).
# Never hard-code access keys here. The service principal needs the following
# Cognito IAM actions on the target User Pool:
#   cognito-idp:ListUsers, AdminGetUser
cognito:
  region: ${COGNITO_REGION:us-east-1}
  user-pool-id: ${COGNITO_USER_POOL_ID:}
  app-client-id: ${COGNITO_APP_CLIENT_ID:}
  default-page-size: 25

# A MongoDB transactional outbox is always written. When the SNS topic is
# configured, committed records are delivered asynchronously to the topic.
authorization-events:
  topic-arn: ${AUTHORIZATION_EVENTS_TOPIC_ARN:}
  region: ${AUTHORIZATION_EVENTS_REGION:${COGNITO_REGION:us-east-1}}
  publish-interval-ms: ${AUTHORIZATION_EVENTS_PUBLISH_INTERVAL_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.designpattern.cognitorbac: INFO
    software.amazon.awssdk: WARN
